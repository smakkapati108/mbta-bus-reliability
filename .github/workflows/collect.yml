# Free, laptop-independent collection. Each run polls every 60s for ~5h50m (jobs are capped
# at 6h), compacts what it collected to Parquet, and uploads it as an artifact. Runs start
# every 6 hours, so coverage is continuous apart from scheduler start-up delays of a few
# minutes. Pull the data locally with scripts/pull_github_data.sh.
#
# Caveats: GitHub may delay scheduled runs at busy times and disables schedules on repos with
# no activity for 60 days. Artifacts are kept for 90 days, so pull them regularly.
name: collect

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to collect"
        default: "350"

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests duckdb
      - name: Collect
        env:
          MBTA_API_KEY: ${{ secrets.MBTA_API_KEY }}
        run: python -m transit collect --duration $(( ${{ github.event.inputs.minutes || 350 }} * 60 ))
      - name: Compact to Parquet
        if: always()
        run: python -m transit compact --include-today --suffix="-${{ github.run_id }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicles-${{ github.run_id }}
          path: data/archive/
          retention-days: 90
          if-no-files-found: warn
